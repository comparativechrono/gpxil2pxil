[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpxil2pxil"
dynamic = ["version"]
description = "Pictures of genes, transcripts and proteins (pxil files) from a gpxil genome: its reference, or a person's haplotypes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chronomic Medicine Group, Department of Genomic Medicine, University of Cambridge" }]
keywords = ["genomics", "gpxil", "pxil", "gene", "transcript", "protein", "haplotype", "image"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["gpxiltools>=0.3", "pxil>=0.1", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gpxil2pxil = "gpxil2pxil.cli:main"

[project.urls]
Source = "https://github.com/comparativechrono/gpxil2pxil"
gpxil = "https://github.com/comparativechrono/Gpxil"
pxil = "https://github.com/comparativechrono/pxil"

[tool.hatch.version]
path = "src/gpxil2pxil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpxil2pxil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
